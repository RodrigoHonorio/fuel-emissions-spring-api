spring.application.name=emissions-calculator

spring.jpa.open-in-view=false

# Porta da aplicação alterada para 8080
server.port=8080

# Configuração do PostgreSQL apontando para o novo banco limpo 'emissions_db'
spring.datasource.url=jdbc:postgresql://localhost:5432/emissions_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Desativação total do Flyway
spring.flyway.enabled=false

# Configuração do Hibernate para criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Configuração para o Spring inicializar o schema.sql automaticamente (cria o PostGIS)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configurações Oficiais da API Fuel Finder (GOV.UK)
fuelfinder.api.base-url=https://api.fuelfinder.service.gov.uk/v1
fuelfinder.api.auth-url=https://api.fuelfinder.service.gov.uk/v1/oauth/token
fuelfinder.api.client-id=30592uPFwCrP002ZPO0S4kLyXuZzRQ0R
