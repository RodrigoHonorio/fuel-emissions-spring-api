<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.I.R.E. - Emissions Calculator</title>
    <!-- Bootstrap 5 CSS for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">S.P.I.R.E. | Fuel Emission Calculator</h4>
                </div>
                <div class="card-body">
                    <form id="emissionForm">
                        <div class="mb-3">
                            <label for="fuelType" class="form-label">Fuel Type</label>
                            <select class="form-select" id="fuelType" required>
                                <option value="PETROL">Petrol</option>
                                <option value="DIESEL">Diesel</option>
                                <option value="ETHANOL">Ethanol</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fuelVolumeLitres" class="form-label">Fuel Volume (Litres)</label>
                            <input type="number" step="any" class="form-control" id="fuelVolumeLitres" placeholder="e.g. 5000" required>
                        </div>
                        <div class="mb-3">
                            <label for="ambientTemperatureCelsius" class="form-label">Ambient Temperature (°C)</label>
                            <input type="number" step="any" class="form-control" id="ambientTemperatureCelsius" placeholder="e.g. 25" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Calculate Emissions</button>
                    </form>

                    <div id="resultContainer" class="mt-4 d-none">
                        <div class="alert alert-info" role="alert">
                            <h5 class="alert-heading">Calculation Result</h5>
                            <p class="mb-0">Estimated VOC Emissions: <strong id="resultValue"></strong> kg</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript to communicate with our Java Spring Boot REST API -->
<script>
    document.getElementById('emissionForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const fuelType = document.getElementById('fuelType').value;
        const fuelVolumeLitres = parseFloat(document.getElementById('fuelVolumeLitres').value);
        const ambientTemperatureCelsius = parseFloat(document.getElementById('ambientTemperatureCelsius').value);

        const payload = {
            fuelType: fuelType,
            fuelVolumeLitres: fuelVolumeLitres,
            ambientTemperatureCelsius: ambientTemperatureCelsius
        };

        try {
            const response = await fetch('http://localhost:8080/api/emissions/calculate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const data = await response.json();

            // Show result on screen
            document.getElementById('resultValue').textContent = data.estimatedVocEmissionsKg.toFixed(2);
            document.getElementById('resultContainer').classList.remove('d-none');

        } catch (error) {
            console.error('Error calculating emissions:', error);
            alert('Failed to connect to the backend server.');
        }
    });
</script>
</body>
</html>
