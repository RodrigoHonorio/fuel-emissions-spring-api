<!DOCTYPE html>
<html lang="pt" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissions Calculator - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased flex items-center justify-center m-0">

<div class="login-container w-full max-w-md p-6">
    <div class="login-card bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <div class="login-header text-center mb-6">
            <h2 class="text-2xl font-bold text-white mb-2">🌍 Emissions Calculator</h2>
            <p class="text-sm text-slate-400">Insira as suas credenciais para aceder ao sistema</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div class="input-group">
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Utilizador</label>
                <input type="text" id="username" required placeholder="Ex: admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div class="input-group">
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Palavra-passe</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <!-- Caixa de erro dinâmica -->
            <div id="errorMsg" class="error-message bg-rose-600/20 border border-rose-500/30 text-rose-300 text-xs p-3 rounded-lg text-center" style="display: none;"></div>

            <button type="submit" id="loginBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 rounded-lg transition shadow-lg text-sm">Entrar</button>
        </form>

        <div class="login-footer text-center mt-6">
            <p class="text-xs text-slate-500">Sistema de Monitorização Ambiental e Emissões • Londres</p>
        </div>
    </div>
</div>

<!-- Script de Autenticação ajustado para direcionar para a pasta /html/ -->
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                }
                // Redireciona corretamente para o dashboard localizado na pasta html/
                window.location.href = '/html/dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Credenciais inválidas. Tente novamente.';
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = 'Erro ao comunicar com o servidor.';
        }
    });
</script>
</body>
</html>
