<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.I.R.E. - Dispersion & Heatmap</title>

    <!-- Leaflet CSS & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #app-container {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
        }
        header {
            background-color: #1a73e8; color: white;
            padding: 10px 20px; flex: 0 0 50px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 18px; font-weight: 600; }
        #controls-bar {
            background: #ffffff; padding: 8px 20px; flex: 0 0 55px;
            display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #ddd;
        }
        .control-group { display: flex; align-items: center; gap: 6px; }
        .control-group span { font-weight: bold; color: #333; font-size: 13px; }
        .filter-btn {
            background-color: #f0f0f0; border: 1px solid #ccc;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
            transition: all 0.2s ease-in-out;
        }
        .filter-btn.active { background-color: #1a73e8; color: white; border-color: #1a73e8; }
        #map {
            flex: 1;
            width: 100%;
            background-color: #e5e3df;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <h1>S.P.I.R.E. - London Emissions & Plume Simulation</h1>
    </header>

    <div id="controls-bar">
        <div class="control-group">
            <span>Exibir:</span>
            <button class="filter-btn active" data-layer="both" onclick="setLayerVisibility('both')">Ambos</button>
            <button class="filter-btn" data-layer="stations" onclick="setLayerVisibility('stations')">Postos</button>
            <button class="filter-btn" data-layer="environment" onclick="setLayerVisibility('environment')">Estações</button>
        </div>
        <div class="control-group">
            <span>Combustível:</span>
            <button class="filter-btn active" data-fuel="both" onclick="setFuelType('both')">Ambos</button>
            <button class="filter-btn" data-fuel="petrol" onclick="setFuelType('petrol')">Gasolina</button>
            <button class="filter-btn" data-fuel="diesel" onclick="setFuelType('diesel')">Diesel</button>
        </div>
    </div>

    <!-- Container do Mapa -->
    <div id="map"></div>
</div>

<!-- 1. Leaflet JS e MarkerCluster -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<!-- 2. Inicialização do Mapa Base com a tua API Key -->
<script>
    console.log("🟢 Inicializando Mapa Base com CARTO API Key...");

    window.map = L.map('map').setView([51.5074, -0.1278], 12);

    // Adicionada a tua chave de API no final da URL
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_3sdq_1_9bb00292c4730146f73e99ac', {
        maxZoom: 20,
        attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(window.map);

    setTimeout(() => { window.map.invalidateSize(); }, 500);

    function setLayerVisibility(layer) {
        document.querySelectorAll('[data-layer]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-layer') === layer);
        });
        if (typeof window.toggleGasStationsLayer === 'function') window.toggleGasStationsLayer(layer);
        if (typeof window.toggleEnvironmentLayer === 'function') window.toggleEnvironmentLayer(layer);
    }

    function setFuelType(type) {
        document.querySelectorAll('[data-fuel]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-fuel') === type);
        });
        if (typeof window.reloadStationsWithCurrentFuel === 'function') window.reloadStationsWithCurrentFuel(type);
    }
</script>

<!-- 3. Módulos Independentes -->
<script src="gas-stations.js"></script>
<script src="stations.js"></script>
<script src="london-borders.js"></script>

</body>
</html>
