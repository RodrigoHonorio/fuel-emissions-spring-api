<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispersão de COV & Plumas Atmosféricas - Londres</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Container do Mapa Leaflet -->
<div id="map"></div>

<!-- Painel Flutuante de Controlo Meteorológico e Parâmetros de Dispersão -->
<div id="control-panel" class="leaflet-bar">
    <h3><i class="fa-solid fa-wind"></i> Dispersão de COV / VOCs</h3>

    <div class="control-group">
        <label for="tempInput">Temperatura Ambiente: <span id="tempValue">20</span>°C</label>
        <input type="range" id="tempInput" min="0" max="40" value="20" step="1">
    </div>

    <div class="control-group">
        <label for="windSpeedInput">Velocidade do Vento: <span id="windSpeedValue">3.5</span> m/s</label>
        <input type="range" id="windSpeedInput" min="0.5" max="15.0" value="3.5" step="0.5">
    </div>

    <div class="control-group">
        <label for="windDirInput">Direção do Vento (Proveniência): <span id="windDirValue">240</span>°</label>
        <input type="range" id="windDirInput" min="0" max="360" value="240" step="5">
    </div>

    <div class="control-group">
        <label for="fuelTypeSelect">Combustível Considerado:</label>
        <select id="fuelTypeSelect">
            <option value="both" selected>Gasolina & Diesel (Mix de Posto)</option>
            <option value="gasoline">Apenas Gasolina (Alta Volatilidade)</option>
            <option value="diesel">Apenas Diesel</option>
        </select>
    </div>

    <hr>

    <h4><i class="fa-solid fa-layer-group"></i> Camadas do Mapa</h4>
    <div class="checkbox-group">
        <label><input type="checkbox" id="toggleHeatmap" checked> Heatmap Acumulado (Superposição)</label>
        <label><input type="checkbox" id="togglePlumes" checked> Vetores de Pluma Individual</label>
        <label><input type="checkbox" id="toggleBorders" checked> Fronteiras dos Distritos de Londres</label>
        <label><input type="checkbox" id="toggleStations" checked> Marcadores dos Postos</label>
    </div>

    <button id="btnRecalculate" class="btn-primary"><i class="fa-solid fa-rotate-right"></i> Recalcular Dispersão</button>
</div>

<!-- Legenda de Intensidade da Poluição de COV -->
<div id="legend-panel" class="leaflet-bar">
    <h4>Concentração de COV (µg/m³)</h4>
    <div class="gradient-bar"></div>
    <div class="legend-labels">
        <span>Baixa (&lt;5)</span>
        <span>Média (25)</span>
        <span>Alta (&gt;50)</span>
    </div>
</div>

<!-- 1. Bibliotecas Externas: Leaflet e Plugin Leaflet Heat (Via cdnjs fiável) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

<!-- 2. Inicialização Base do Mapa -->
<script src="js/map-init.js"></script>

<!-- 3. Scripts Antigos do Projeto -->
<script src="js/london-borders.js"></script>
<script src="js/stations.js"></script>
<script src="js/gas-stations.js"></script>

<!-- 4. Módulos de Cálculo e Visualização de Plumas de COV -->
<script src="js/voc-heatmap.js"></script>
<script src="js/weather-controls.js"></script>

</body>
</html>
