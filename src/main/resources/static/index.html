<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispersão de COV & Plumas Atmosféricas - Londres</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Container do Mapa Leaflet -->
<div id="map"></div>

<!-- Painel Flutuante de Controlo Meteorológico e Parâmetros de Dispersão -->
<div id="control-panel" class="leaflet-bar">
    <h3><i class="fa-solid fa-wind"></i> Dispersão de COV / VOCs</h3>

    <!-- Painel de Meteorologia em Tempo Real (Rosa dos Ventos) -->
    <div class="weather-panel">
        <div class="compass-wrapper">
            <div class="compass">
                <span class="compass-dir n">N</span>
                <span class="compass-dir e">E</span>
                <span class="compass-dir s">S</span>
                <span class="compass-dir w">W</span>
                <div class="compass-arrow" id="compassArrow">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
                <div class="compass-center-value">
                    <span id="wt-wind-speed">--</span><br>
                    <small>m/s</small>
                </div>
            </div>
        </div>

        <div class="weather-grid">
            <div class="w-item" title="Temperatura">
                <i class="fa-solid fa-temperature-half" style="color:#ff6b6b"></i> <span id="wt-temp">--°C</span>
            </div>
            <div class="w-item" title="Direção do Vento">
                <i class="fa-regular fa-compass" style="color:#4facfe"></i> <span id="wt-dir">--°</span>
            </div>
            <div class="w-item" title="Humidade">
                <i class="fa-solid fa-droplet" style="color:#00f2fe"></i> <span id="wt-hum">--%</span>
            </div>
            <div class="w-item" title="Índice UV">
                <i class="fa-solid fa-sun" style="color:#fdda0d"></i> <span id="wt-uv">--</span>
            </div>
        </div>
    </div>

    <div class="control-group" style="margin-top: 15px;">
        <label for="fuelTypeSelect">Combustível Considerado:</label>
        <select id="fuelTypeSelect">
            <option value="both" selected>Gasolina & Diesel (Mix de Posto)</option>
            <option value="gasoline">Apenas Gasolina (Alta Volatilidade)</option>
            <option value="diesel">Apenas Diesel</option>
        </select>
    </div>

    <hr>

    <h4><i class="fa-solid fa-layer-group"></i> Camadas do Mapa</h4>
    <div class="checkbox-group">
        <label><input type="checkbox" id="toggleHeatmap" checked> Manchas de Poluição (Heatmap)</label>
        <label><input type="checkbox" id="toggleGasStations" checked> Postos de Combustível (⛽)</label>
        <label><input type="checkbox" id="toggleEnvStations" checked> Estações Ambientais (🍃)</label>
    </div>
</div>

<!-- Legenda de Intensidade da Poluição de COV -->
<div id="legend-panel" class="leaflet-bar">
    <h4>Concentração de COV (µg/m³)</h4>
    <div class="gradient-bar"></div>
    <div class="legend-labels">
        <span>Baixa (&lt;5)</span>
        <span>Média (25)</span>
        <span>Alta (&gt;50)</span>
    </div>
</div>

<!-- Bibliotecas Externas -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

<!-- Scripts do Projeto -->
<script src="js/map-init.js"></script>
<script src="js/london-borders.js"></script>
<script src="js/stations.js"></script>
<script src="js/gas-stations.js"></script>
<script src="js/voc-heatmap.js"></script>
<script src="js/weather-controls.js"></script>

</body>
</html>
