<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.P.I.R.E. - Dashboard Integrado</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">

        <!-- PAINEL 1: Calculadora de Emissões (Seu código original) -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">S.P.I.R.E. | Fuel Emission Calculator</h4>
                </div>
                <div class="card-body">
                    <form id="emissionForm">
                        <div class="mb-3">
                            <label for="fuelType" class="form-label">Fuel Type</label>
                            <select class="form-select" id="fuelType" required>
                                <option value="PETROL">Petrol</option>
                                <option value="DIESEL">Diesel</option>
                                <option value="ETHANOL">Ethanol</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fuelVolumeLitres" class="form-label">Fuel Volume (Litres)</label>
                            <input type="number" step="any" class="form-control" id="fuelVolumeLitres" placeholder="e.g. 5000" required>
                        </div>
                        <div class="mb-3">
                            <label for="ambientTemperatureCelsius" class="form-label">Ambient Temperature (°C)</label>
                            <input type="number" step="any" class="form-control" id="ambientTemperatureCelsius" placeholder="e.g. 25" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Calculate Emissions</button>
                    </form>

                    <div id="resultContainer" class="mt-4 d-none">
                        <div class="alert alert-info" role="alert">
                            <h5 class="alert-heading">Calculation Result</h5>
                            <p class="mb-0">Estimated VOC Emissions: <strong id="resultValue"></strong> kg</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAINEL 2: Dados ao vivo de Londres (Nova Integração) -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">🌍 Live London Air Quality (TfL)</h4>
                </div>
                <div class="card-body">
                    <p id="londonSummary" class="text-muted fst-italic">Conectando aos servidores de Londres...</p>

                    <ul class="list-group list-group-flush mt-3">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            NO2 (Nitrogen Dioxide)
                            <span id="no2Badge" class="badge rounded-pill bg-secondary">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            PM10 (Particulate Matter)
                            <span id="pm10Badge" class="badge rounded-pill bg-secondary">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            PM2.5 (Fine Particles - NHS Risk)
                            <span id="pm25Badge" class="badge rounded-pill bg-secondary">-</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // --- LÓGICA 1: Calculadora de Emissões (Seu código original) ---
    document.getElementById('emissionForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const payload = {
            fuelType: document.getElementById('fuelType').value,
            fuelVolumeLitres: parseFloat(document.getElementById('fuelVolumeLitres').value),
            ambientTemperatureCelsius: parseFloat(document.getElementById('ambientTemperatureCelsius').value)
        };

        try {
            const response = await fetch('http://localhost:8080/api/emissions/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            document.getElementById('resultValue').textContent = data.estimatedVocEmissionsKg.toFixed(2);
            document.getElementById('resultContainer').classList.remove('d-none');

        } catch (error) {
            console.error('Error calculating emissions:', error);
            alert('Failed to connect to the calculator backend.');
        }
    });

    // --- LÓGICA 2: Captura automática dos dados de Londres ao carregar a página ---
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('http://localhost:8080/api/v1/london/air-quality');
            if (!response.ok) throw new Error('Failed to fetch London data');

            const data = await response.json();
            const forecast = data.currentForecast[0]; // Pega a previsão de hoje

            // Atualiza o texto do painel
            document.getElementById('londonSummary').textContent = forecast.forecastSummary;

            // Função para aplicar a cor do Bootstrap baseada na faixa de poluição
            const updateBadge = (elementId, bandValue) => {
                const badge = document.getElementById(elementId);
                badge.textContent = bandValue;
                badge.classList.remove('bg-secondary');

                if (bandValue.toLowerCase() === 'low') {
                    badge.classList.add('bg-success');
                } else if (bandValue.toLowerCase() === 'moderate') {
                    badge.classList.add('bg-warning', 'text-dark');
                } else {
                    badge.classList.add('bg-danger');
                }
            };

            // Atualiza as tags visuais
            updateBadge('no2Badge', forecast.nO2Band);
            updateBadge('pm10Badge', forecast.pM10Band);
            updateBadge('pm25Badge', forecast.pM25Band);

        } catch (error) {
            console.error('Error loading London data:', error);
            document.getElementById('londonSummary').textContent = "Falha ao carregar dados em tempo real da TfL.";
        }
    });
</script>
</body>
</html>
