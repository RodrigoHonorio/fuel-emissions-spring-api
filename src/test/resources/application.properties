# Configuração em memória isolada para os Testes (H2)
spring.datasource.url=jdbc:h2:mem:spire_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para Testes (Usando o dialeto padrão; o Hibernate 6 gerencia o spatial automaticamente)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Propriedade da API da TfL
tfl.api.url=https://api.tfl.gov.uk/AirQuality